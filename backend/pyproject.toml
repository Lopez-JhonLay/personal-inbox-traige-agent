[project]
name = "personal-inbox-triage-backend"
version = "0.0.0"
description = "Flask backend foundation for the Personal Inbox Triage Agent"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Flask==3.1.3",
    "flask-cors==6.0.5",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "SQLAlchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "openai==3.51.0",
    "google-api-python-client==2.202.0",
    "google-auth==2.62.2",
    "google-auth-oauthlib==1.5.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
